<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Sem conexão — Gestor IXTV</title>
    <meta name="theme-color" content="#6366f1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="/assets/js/offline.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #000000;
        --surface: #0a0a0a;
        --border: #202020;
        --text: #f5f5f5;
        --muted: #a1a1aa;
        --primary: #cc98eb;
        --button-primary: #783393;
        --primary-strong: #8b3daa;
      }
      :root[data-theme="dark"] {
        --bg: #14161b;
        --surface: #1d2027;
        --border: #3b424f;
        --text: #f1f3f8;
        --muted: #b5bdcb;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f7f8fa;
        --surface: #ffffff;
        --border: #d5dae3;
        --text: #192232;
        --muted: #566173;
        --primary: #783393;
        --primary-strong: #64277c;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: calc(24px + env(safe-area-inset-top, 0px))
                 calc(20px + env(safe-area-inset-right, 0px))
                 calc(24px + env(safe-area-inset-bottom, 0px))
                 calc(20px + env(safe-area-inset-left, 0px));
        -webkit-text-size-adjust: 100%;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 32px 26px;
        text-align: center;
        box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.45);
      }
      .glyph {
        width: 66px;
        height: 66px;
        margin: 0 auto 18px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: color-mix(in srgb, var(--primary) 16%, transparent);
        color: var(--primary);
        font-size: 30px;
      }
      h1 { margin: 0 0 8px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
      p { margin: 0 auto 22px; font-size: 14px; line-height: 1.5; color: var(--muted); max-width: 30ch; }
      .btn {
        appearance: none;
        border: none;
        cursor: pointer;
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: var(--button-primary);
        transition: background 0.15s ease, transform 0.05s ease;
      }
      .btn:hover { background: var(--primary-strong); }
      .btn:active { transform: translateY(1px); }
      .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
      .status {
        margin-top: 14px;
        font-size: 12.5px;
        color: var(--muted);
        min-height: 18px;
      }
      .status.online { color: #22c55e; font-weight: 600; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="glyph" aria-hidden="true">⚡</div>
      <h1>Sem conexão</h1>
      <p>
        O Gestor IXTV precisa de internet para carregar seus clientes, cobranças
        e mensagens. Verifique sua conexão e tente de novo.
      </p>
      <form id="retry-form">
        <button class="btn" type="submit" id="retry">Tentar novamente</button>
      </form>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </main>
  </body>
</html>
