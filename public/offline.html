<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sem conexão — ixstreaming</title>
  <meta name="theme-color" content="#6366f1" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script>
    // Honra o tema salvo pelo app (mesma chave do painel), com fallback pro
    // esquema do sistema. Roda antes do paint pra não piscar.
    try {
      var t = localStorage.getItem('gestor-theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) {}
  </script>
  <style>
    :root {
      --bg: #0b1220;
      --surface: #111a2e;
      --border: rgba(148, 163, 184, 0.18);
      --text: #e5e9f2;
      --muted: #94a3b8;
      --primary: #6366f1;
      --primary-strong: #4f46e5;
    }
    :root[data-theme="light"] {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --border: rgba(15, 23, 42, 0.10);
      --text: #0f172a;
      --muted: #64748b;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f4f6fb;
        --surface: #ffffff;
        --border: rgba(15, 23, 42, 0.10);
        --text: #0f172a;
        --muted: #64748b;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: calc(24px + env(safe-area-inset-top, 0px))
               calc(20px + env(safe-area-inset-right, 0px))
               calc(24px + env(safe-area-inset-bottom, 0px))
               calc(20px + env(safe-area-inset-left, 0px));
      -webkit-text-size-adjust: 100%;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px 26px;
      text-align: center;
      box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.45);
    }
    .glyph {
      width: 66px;
      height: 66px;
      margin: 0 auto 18px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: color-mix(in srgb, var(--primary) 16%, transparent);
      color: var(--primary);
      font-size: 30px;
    }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
    p { margin: 0 auto 22px; font-size: 14px; line-height: 1.5; color: var(--muted); max-width: 30ch; }
    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      transition: background 0.15s ease, transform 0.05s ease;
    }
    .btn:hover { background: var(--primary-strong); }
    .btn:active { transform: translateY(1px); }
    .status {
      margin-top: 14px;
      font-size: 12.5px;
      color: var(--muted);
      min-height: 18px;
    }
    .status.online { color: #22c55e; font-weight: 600; }
  </style>
</head>
<body>
  <main class="card">
    <div class="glyph" aria-hidden="true">⚡</div>
    <h1>Sem conexão</h1>
    <p>O ixstreaming precisa de internet para carregar seus clientes, cobranças e mensagens. Verifique sua conexão e tente de novo.</p>
    <button class="btn" type="button" id="retry">Tentar novamente</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    var statusEl = document.getElementById('status');
    var retryEl = document.getElementById('retry');

    function recarregar() {
      statusEl.textContent = 'Reconectando…';
      // Volta pra rota anterior se o navegador guardou; senão, dashboard.
      var destino = document.referrer && document.referrer.indexOf(location.origin) === 0
        ? document.referrer
        : '/dashboard';
      location.replace(destino);
    }

    retryEl.addEventListener('click', recarregar);

    // Volta sozinho assim que a conexão retornar.
    window.addEventListener('online', function () {
      statusEl.textContent = 'Conexão de volta! Recarregando…';
      statusEl.classList.add('online');
      setTimeout(recarregar, 600);
    });

    // Reflete o estado atual ao abrir.
    if (navigator.onLine === false) {
      statusEl.textContent = 'Você está offline.';
    }
  </script>
</body>
</html>
